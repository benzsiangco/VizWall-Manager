<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizWall Workspace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #08070d;
            color: #ffffff;
            font-size: 13px;
            overflow-x: hidden;
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-col: column;
            flex-direction: column;
        }

        /* Ambient Glows */
        .ambient-glow {
            position: absolute;
            top: -50px;
            left: 20%;
            width: 60%;
            height: 150px;
            background: rgba(139, 92, 246, 0.08);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Container */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            gap: 10px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 18px;
            height: 18px;
            fill: #8b5cf6;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.2px;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444; /* red for disconnected, green for connected */
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Filters Section */
        .filters {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            appearance: none;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: rgba(139, 92, 246, 0.5);
            background-color: rgba(255, 255, 255, 0.05);
        }

        select option {
            background-color: #0c0a14;
            color: #fff;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Search input */
        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 12px 8px 30px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: rgba(139, 92, 246, 0.5);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2.5;
            fill: none;
        }

        /* Scroll Area */
        .scroll-area {
            flex-1: 1;
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            background-color: rgba(6, 5, 10, 0.3);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 100px;
        }

        /* Scrollbar styles */
        .scroll-area::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .scroll-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Asset Items */
        .asset-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .asset-item:hover {
            background-color: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .asset-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            color: #a78bfa;
            flex-shrink: 0;
        }

        .asset-info {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .asset-name {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asset-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.35);
        }

        .asset-category {
            background-color: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 8px;
            text-transform: uppercase;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 10px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            gap: 8px;
            height: 100%;
        }

        .empty-icon {
            width: 24px;
            height: 24px;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 2;
            fill: none;
        }

        /* Footer status message */
        .footer-status {
            padding: 4px 6px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .footer-action {
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
        }
        
        .footer-action:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
                <span class="title">VizWall Workspace</span>
            </div>
            <div id="statusDot" class="status-dot" title="Workspace Database Not Connected"></div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <!-- Project Dropdown -->
            <div class="select-wrapper">
                <select id="projectSelect" disabled>
                    <option value="">Select Project...</option>
                </select>
            </div>
            
            <!-- Search -->
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search assets..." disabled>
            </div>
        </div>

        <!-- Scrollable Asset Area -->
        <div id="scrollArea" class="scroll-area">
            <div class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
                <div>No database connected</div>
                <div style="font-size: 10px; color: rgba(255, 255, 255, 0.15);">Ensure the main app has run once to initialize database.</div>
            </div>
        </div>

        <!-- Footer / Connection Status -->
        <div class="footer-status">
            <span id="statusText">Disconnected</span>
            <span id="refreshBtn" class="footer-action" style="display: none;">Refresh</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="lib/CSInterface.js"></script>
    <script src="lib/sql-wasm.js"></script>
    <script src="index.js"></script>
</body>
</html>
